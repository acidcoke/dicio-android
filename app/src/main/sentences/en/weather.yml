# Words after which the rest of the utterance is open vocabulary and must be decoded
# free-form instead of being forced onto the words of the recognition grammar. They
# are only in effect while this skill is enabled, and must appear in the sentences below.
dictation_triggers:
  - weather

current:
  - (what|how is|s)|whats the weather like? (in|on .where.)?
  - weather (in|on? .where.)?
  - how is it outside
  - is it cold|cool|warm|hot|sunny|rainy|raining (in|on .where.)|outside?
