# Wörter, nach denen der Rest der Äußerung freies Vokabular ist und frei erkannt werden
# muss, statt auf die Wörter der Erkennungsgrammatik gezwungen zu werden. Sie gelten nur,
# solange dieser Skill aktiviert ist, und müssen in den Sätzen unten vorkommen.
dictation_triggers:
  - regnet
  - schneit
  - hagelt
  - scheint
  - wetter

current:
  - regnet|schneit|hagelt es draußen|(in .where.)?
  - wie ist|wird das wetter draußen|(in .where.)?
  - ist es kalt|warm|eisig|nebelig|regnerisch|verschneit|sonnig draußen?
  - regnet|schneit|hagelt es (in .where.)?
  - ist es (in .where.)? kalt|warm|eisig|nebelig|regnerisch|verschneit|sonnig (in .where.)?
  - scheint die sonne (in .where.)?
  - wetter .where.
